<html lang="vi" data-beasties-container="">
<head>
  <meta charset="utf-8">
  <title>Interview Hub</title>
  <base href="/interview-hub/">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Phòng tập phỏng vấn: Angular, Java/Spring Boot, DevOps, Data — tình huống thật trong dự án enterprise, bank, bảo hiểm.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    /*
     * Dat theme TRUOC khi paint. Trang duoc prerender thanh HTML tinh (khong co
     * class .dark), nen neu doi ThemeService chay sau hydration thi may dat theme
     * toi se nhay trang mot nhip. Script nay chay sync trong <head> nen khong co
     * nhip nao bi nhay. Giu dong bo voi ThemeService (khoa 'ih.theme').
     */
    (function () {
      try {
        var mode = localStorage.getItem('ih.theme') || 'system';
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {
        /* localStorage bi chan (private mode): bo qua, mac dinh sang */
      }
    })();
  </script>
